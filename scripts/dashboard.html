<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>번역 프로젝트 대시보드</title>
<style>
:root{--ground:#EDEFEE;--surface:#fff;--surface2:#F5F7F6;--ink:#12171A;--muted:#5A6668;
--faint:#8A9698;--accent:#0F6E73;--accent-ink:#fff;--accent-soft:#DDEDED;--warn:#A85F22;
--warn-soft:#F6E8DA;--border:#D2D9D8;--border2:#B6C2C1}
@media(prefers-color-scheme:dark){:root{--ground:#0E1414;--surface:#161F1E;--surface2:#1D2726;
--ink:#E6EDEC;--muted:#93A2A2;--faint:#71807F;--accent:#57C3C7;--accent-ink:#0B1414;
--accent-soft:#17322F;--warn:#DB9752;--warn-soft:#2A2118;--border:#26302F;--border2:#3A4746}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,
"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 72px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);
padding:22px 0 0;box-shadow:0 8px 12px -10px rgba(0,0,0,.25)}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
.live{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.restart{font:inherit;font-size:11.5px;background:none;color:var(--faint);cursor:pointer;
border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin-left:8px}
.restart:hover{color:var(--ink);border-color:var(--border2)}

nav{display:flex;gap:4px;margin:16px 0 0;border-bottom:1px solid var(--border)}
nav button{font:inherit;font-size:18px;background:none;border:0;border-bottom:2px solid transparent;
padding:10px 18px;color:var(--muted);cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* 섹션 구분 */
.sect{background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:20px 22px 22px;margin-bottom:20px}
.sect > h2{font-size:19px;margin:0 0 14px;padding-left:11px;border-left:4px solid var(--accent);
letter-spacing:-.01em}
.sect > h2 .n{color:var(--muted);font-weight:400;font-size:16px}
.sect > h2 .tip{color:var(--faint);font-weight:400;font-size:13px}

/* 진행 현황 */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;align-items:end}
.stat .k{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.stat .v{font-size:38px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;
letter-spacing:-.02em}
.stat .v small{font-size:16px;font-weight:400;color:var(--muted);margin-left:3px}
.progbar{grid-column:1/-1;height:12px;border-radius:99px;background:var(--surface2);
border:1px solid var(--border);overflow:hidden;margin-top:4px}
.progbar span{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.progfoot{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px}
.card .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;
letter-spacing:-.01em;line-height:1.25}
.card .v small{font-size:17px;font-weight:400;color:var(--muted)}
.card .v .txt{font-size:16px;font-weight:500}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;
background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.badge.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.why.hits{font-size:11.5px;color:var(--faint);margin:2px 0 6px}
.q .p em{font-style:normal;opacity:.7}
.badge.warnb{background:#B3261E;color:#fff;border-color:transparent;cursor:help}

/* 단계 배지 — 무지개색 대신 한 색의 농담으로. 단계는 순서가 있는 값이라
   연한 색에서 진한 색으로 가면 색 자체가 진행도를 나타낸다. 색만으로 구분하지
   않도록 글자 라벨은 그대로 둔다. */
.badge.st{border-color:transparent;background:rgba(15,110,115,var(--a));color:var(--ink)}
.st0{--a:.08}.st1{--a:.16}.st2{--a:.25}.st3{--a:.36}
.st4{--a:.48}.st5{--a:.63}.st6{--a:.80}.st7{--a:1}
.badge.st5,.badge.st6,.badge.st7{color:#fff}
@media(prefers-color-scheme:dark){
  .badge.st{background:rgba(87,195,199,var(--a));color:var(--ink)}
  .badge.st5,.badge.st6,.badge.st7{color:#0B1414}
}
/* 단계 범례는 배지로 만들었더니 너무 두드러져 정작 표가 안 읽혔다.
   담백한 글자로 오른쪽에 두고, 고른 단계만 진하게 한다. */
.sect > h2.withleg{display:flex;align-items:baseline;gap:16px}
.legend{margin-left:auto;font-size:13px;font-weight:400;color:var(--muted);
letter-spacing:0;font-variant-numeric:tabular-nums}
.legend a{color:inherit;text-decoration:none;cursor:pointer}
.legend a:hover{color:var(--ink)}
.legend a.on{color:var(--ink);font-weight:700}
.legend.filtered a:not(.on){color:var(--faint);opacity:.55}
.legend .sep{color:var(--faint);margin:0 5px;opacity:.7}
.legend .clear{margin-left:8px;color:var(--accent);text-decoration:underline;cursor:pointer}
tbody tr.faded{opacity:.28}
.link{color:var(--accent);font-size:13px;text-decoration:none;margin-right:10px}
.link.off{color:var(--faint);opacity:.45;cursor:default;text-decoration:none;margin-right:10px}

.term{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
padding:16px 18px;margin-bottom:12px}
.term.edit{border-color:var(--accent);background:var(--surface)}
.term h3{margin:0 0 3px;font-size:18px}
.term .why{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.term .why.alt{margin:0 0 4px;color:var(--ink)}
.term .why.alt b{color:var(--accent)}
.term .why.sense{margin:0 0 4px;padding-left:10px;border-left:2px solid var(--accent-soft)}
.term .why.sense b{color:var(--ink)}
.q{display:grid;grid-template-columns:64px 1fr;gap:11px;padding-left:11px;
border-left:2px solid var(--border2);margin-bottom:8px;align-items:baseline}
.q.hid{display:none}
.q a.p{color:var(--accent);text-decoration:none}
.q a.p:hover{text-decoration:underline}
.q mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
/* 용례를 모두 펼치면 넓은 영역에서 스크롤해 훑는다 */
.quotes.open{max-height:340px;overflow-y:auto;padding-right:6px;
border:1px solid var(--border);border-radius:9px;padding:10px 10px 2px;margin-bottom:8px}
.qmore{font:inherit;font-size:12.5px;background:none;border:0;color:var(--accent);
cursor:pointer;padding:0 0 8px;text-decoration:underline}
.q .p{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.q .t{font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.5}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.opts button{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
border:1px solid var(--border2);border-radius:8px;padding:8px 14px;cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.opts button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
border:1px solid var(--border);border-radius:7px;padding:8px 11px;flex:1 1 220px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.save{flex:0 0 auto;font:inherit;font-size:13px;background:var(--surface2);color:var(--ink);
border:1px solid var(--border2);border-radius:7px;padding:8px 14px;cursor:pointer}
.save:hover{border-color:var(--accent)}
pre{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:14px;
overflow-x:auto;font-size:13px;line-height:1.55;margin:0}
.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px 20px}
.pair{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer}
.pair:hover{background:var(--surface2)}
.pair .en{color:var(--muted)}
.hidden{display:none}
section > .sect:first-child{margin-top:22px}
.acc{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.acc .arrow{color:var(--accent);font-size:13px;transition:transform .15s ease}
.acc.open .arrow{transform:rotate(90deg)}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}
.filters button{font:inherit;font-size:12.5px;background:var(--surface2);color:var(--muted);
border:1px solid var(--border);border-radius:6px;padding:3px 9px;cursor:pointer;
font-variant-numeric:tabular-nums}
.filters button:hover{border-color:var(--accent);color:var(--ink)}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.danger{border-color:#b4443a;color:#b4443a}
.danger:hover{background:#b4443a;color:#fff}
@keyframes flashcard{0%{box-shadow:0 0 0 0 var(--accent);background:var(--accent-soft)}
100%{box-shadow:0 0 0 14px transparent;background:var(--surface)}}
.term.flash{animation:flashcard 1.4s ease-out}
@keyframes bump{0%{color:var(--accent);transform:scale(1.06)}100%{color:inherit;transform:scale(1)}}
.stat .v.bump{animation:bump 1.1s ease-out;transform-origin:left center;display:inline-block}
@media(prefers-reduced-motion:reduce){.term.flash{animation:none;box-shadow:0 0 0 3px var(--accent)}}
.inbox{border-color:var(--warn)}
.inbox > h2{border-left-color:var(--warn)}
.inbox ul{margin:0;padding-left:20px}
.inbox li{margin:3px 0;font-size:14px}
.inbox .ts{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;margin-right:8px}
</style></head><body><div class="wrap">
<div class="top">
<header>
  <h1>번역 프로젝트 대시보드</h1>
  <span class="sub" id="book"></span>
  <span class="live" id="live">연결 중…</span>
  <button class="restart" id="restart" title="서버 코드를 고친 뒤 반영이 안 될 때 누르세요. 창을 새로 열 필요가 없습니다.">서버 재실행</button>
</header>
<nav>
  <button data-tab="overview" aria-selected="true">개요</button>
  <button data-tab="chunks" aria-selected="false">청크</button>
  <button data-tab="glossary" aria-selected="false">용어집</button>
</nav>
</div>
<section id="overview"></section>
<section id="chunks" class="hidden"></section>
<section id="glossary" class="hidden"></section>
</div>
<script src="/terms.js"></script>
<script>
let S=null, tab="overview", lastJSON="", editing=null, query="", flashPending=false;
let stageFilter=null;      // 청크 목록에서 추려 볼 단계 (null이면 전체)
const quotesOpen={};       // 용어별 '용례 모두 보기' 펼침 상태

// 용어 짚기는 /terms.js 에 모아 두었다. 원문/번역본 보기 화면도 같은 것을 쓴다.
const mark=(text,term)=>TermTools.markHTML(esc(text), term);

const acc={decided:false,untouched:false};
const filter={decided:"전체",untouched:"전체"};
const el=id=>document.getElementById(id);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["overview","chunks","glossary"].forEach(t=>el(t).classList.toggle("hidden",t!==tab));
});
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const card=(k,v)=>'<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+v+"</div></div>";
const stat=(k,v)=>'<div class="stat"><div class="k">'+esc(k)+'</div><div class="v">'+v+"</div></div>";

/* ---------------- 공통 ---------------- */
// 원어 표기: 꼭 필요한 경우에만 대문자를 유지한다
function dispTerm(x){
  const t = typeof x === "string" ? x : x.term;
  const def = (typeof x === "object" && x.definition_en) || "";
  if(/[A-Z]{2,}/.test(t)) return t;                 // 약어 (ISO, AMIA, CRI …)
  if(/.[A-Z]/.test(t)) return t;                    // 내부 대문자 (Betacam SP, A-D Strips …)
  const w = t.split(/\s+/)[0];
  if(w.length>2 && def && new RegExp("[a-z,;:]\\s+"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(def))
    return t;                                       // 정의문 안에서도 대문자 → 고유명사
  return t.charAt(0).toLowerCase()+t.slice(1);
}
function initialOf(t){
  const c=t.trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : "#";
}

/* ---------------- 개요 ---------------- */
function renderOverview(){
  const i=S.info||{}, m=i.measured||{}, g=S.glossary, p=S.progress;
  const box=S.inbox||{unacked:0,items:[]};
  let h="";
  if(box.unacked){
    h+='<div class="sect inbox"><h2>AI가 아직 확인하지 않은 결정 <span class="n">('+box.unacked+')</span></h2>'
      +'<p class="sub">다음 작업을 시작할 때 AI가 이 목록을 먼저 확인하고, 반영한 뒤 표시를 지웁니다.</p><ul>';
    for(const r of box.items)
      h+='<li><span class="ts">'+esc((r.ts||"").slice(5,16).replace("T"," "))+"</span>"
        +esc(r.term)+" → <strong>"+esc(r.choice)+"</strong>"
        +(r.note?' <span class="sub">('+esc(r.note)+")</span>":"")+"</li>";
    h+="</ul></div>";
  }
  h+='<div class="sect"><h2>진행 현황</h2><div class="hero">'
    +stat("번역 시작", '<span style="font-size:26px">'+esc(p.started)+"</span>")
    +stat("경과", p.elapsed_days+"<small>일째</small>")
    +stat("진행율", p.percent+"<small>%</small>")
    +'<div class="progbar"><span style="width:'+p.percent+'%"></span></div>'
    +'<div class="progfoot">청크 '+S.chunks.length+"개 × 단계 "+p.per_chunk
    +"  ·  완료 단계 "+p.steps_done+" / "+p.steps_total+"</div></div></div>";

  const done=S.chunks.filter(c=>c.has_source).length;
  h+='<div class="sect"><h2>원서</h2><div class="cards">'
    +card("분량",(i.total_file_pages||"-")+'<small> 쪽</small>')
    +card("인쇄 쪽번호",'<span class="txt">'+esc(i.printed_range||"-")+"</span>")
    +card("텍스트 레이어",'<span class="txt">'+esc(i.text_layer||"-")+"</span>")
    +card("정규화된 청크",done+'<small> / '+S.chunks.length+"</small>")
    +card("용어집",g.decided+'<small> / '+g.total+"</small>")
    +card("결정 대기",g.pending+'<small> 건</small>')
    +card("원본 대조 미완",((S.visual||{}).open||0)+'<small> 건</small>')+"</div></div>";

  h+='<div class="sect"><h2>측정값</h2><div class="cards">';
  for(const k in m){
    const v=String(m[k]);
    h+=card(k, /^[\d.,%]+$/.test(v) ? v : '<span class="txt">'+esc(v)+"</span>");
  }
  h+="</div></div>";
  if(S.commits.length)
    h+='<div class="sect"><h2>최근 작업 기록</h2><pre>'+esc(S.commits.join("\n"))+"</pre></div>";
  el("overview").innerHTML=h;
}

/* ---------------- 청크 ---------------- */
function renderChunks(){
  // 범례 겸 필터. 숫자는 '지금 그 단계에 머물러 있는 청크 수'이므로 다 더하면 전체가 된다.
  const p=S.progress, labels=p.stage_labels||[], stages=p.stages||[];
  const cnt={};
  for(const c of S.chunks) cnt[c.stage]=(cnt[c.stage]||0)+1;
  let leg='<span class="legend'+(stageFilter?" filtered":"")+'">';
  stages.forEach((s,i)=>{
    const n=cnt[s]||0;
    if(i) leg+='<span class="sep">›</span>';
    leg+='<a data-stage="'+esc(s)+'"'+(stageFilter===s?' class="on"':"")
       +' title="이 단계에 머물러 있는 청크 '+n+'개 — 눌러서 추리기">'
       +esc(labels[i]||s)+" "+n+"</a>";
  });
  if(stageFilter) leg+='<span class="clear" id="clearStage">전체 보기</span>';
  leg+="</span>";

  let h='<div class="sect"><h2 class="withleg">청크 목록'+leg+"</h2>"
    +"<table><thead><tr><th>청크</th><th>제목</th><th>원서 쪽</th><th>분량</th><th>단계</th><th>보기</th></tr></thead><tbody>";
  for(const c of S.chunks){
    const si=Math.max(0, stages.indexOf(c.stage));
    const faded=stageFilter && c.stage!==stageFilter;
    h+='<tr class="'+(faded?"faded":"")+'" data-id="'+esc(c.id)+'" data-src="'+(c.has_source?1:0)+'" data-tgt="'+(c.has_target?1:0)+'">'
      +"<td>"+esc(c.id)+"</td><td>"+esc(c.title)+"</td>"
      +'<td class="num">'+esc((c.printed||[]).join("–"))+"</td>"
      +'<td class="num">'+esc(c.pages||"")+"</td>"
      +'<td><span class="badge st st'+si+'">'+esc(c.stage_label||c.stage)+"</span>"
      +(c.split?' <span class="badge">절 분할</span>':"")
      +(c.src_needs_parser?' <span class="badge warnb" title="줄바꿈 판정 불확실 '
         +c.src_quality.ratio+'% — 산문용 정규화로는 부족합니다. 전용 파서로 다시 만들어야 합니다.">'
         +'정규화 재작업 필요</span>':"")
      +(c.visual&&c.visual.open?' <span class="badge warnb" title="표·도판·불확실 구간 '
         +c.visual.total+'건 중 '+c.visual.open+'건을 아직 원본과 대조하지 않았습니다.">'
         +'원본 대조 '+c.visual.open+'건</span>':"")+"</td>"
      +"<td>"
      +(c.has_source?'<a class="link" target="_blank" href="/view?kind=source&id='+esc(c.id)+'">원문</a>'
                    :'<span class="link off">원문</span>')
      +(c.has_target?'<a class="link" target="_blank" href="/view?kind=chapters&id='+esc(c.id)+'">번역본</a>'
                    :'<span class="link off">번역본</span>')
      +(c.has_source&&c.has_target?'<a class="link" target="_blank" href="/compare?id='+esc(c.id)+'">대조</a>'
                    :'<span class="link off">대조</span>')
      +"</td></tr>";
  }
  h+='</tbody></table></div><div class="sect"><h2>status.md</h2><pre>'+esc(S.status_md||"(비어 있음)")+"</pre></div>";
  el("chunks").innerHTML=h;
  el("chunks").querySelectorAll(".legend a[data-stage]").forEach(b=>{
    b.onclick=()=>{ const s=b.dataset.stage;
      stageFilter = (stageFilter===s) ? null : s;   // 같은 것을 다시 누르면 전체로
      renderChunks(); };
  });
  const cl=el("clearStage"); if(cl) cl.onclick=()=>{ stageFilter=null; renderChunks(); };
}

/* ---------------- 용어집 ---------------- */
function listSection(key, title, items, tip){
  const open=acc[key], filt=filter[key]||"전체";
  const letters=[...new Set(items.map(x=>initialOf(x.term)))].sort();
  const shown=filt==="전체"?items:items.filter(x=>initialOf(x.term)===filt);
  let h='<div class="sect"><h2 class="acc'+(open?" open":"")+'" data-acc="'+key+'">'
    +'<span class="arrow">▶</span>'+title+' <span class="n">('+items.length+')</span>'
    +(tip?' <span class="tip">'+tip+"</span>":"")+"</h2>";
  if(open){
    h+='<div class="filters">'
      +'<button data-f="'+key+'" data-v="전체"'+(filt==="전체"?' class="on"':"")+">전체</button>";
    for(const L of letters)
      h+='<button data-f="'+key+'" data-v="'+L+'"'+(filt===L?' class="on"':"")+">"+L+"</button>";
    h+="</div><div class=\"two\">";
    for(const x of shown)
      h+='<div class="pair" data-term="'+esc(x.term)+'"><span class="en">'+esc(dispTerm(x))
        +(x.full?' <span class="tip">— '+esc(x.full)+"</span>":"")
        +'</span><span>'+esc(x.translation||"—")+"</span></div>";
    h+="</div>";
    if(!shown.length) h+='<p class="sub">해당 글자로 시작하는 용어가 없습니다.</p>';
  }
  return h+"</div>";
}

function renderGlossary(){
  const g=S.glossary;
  const untouched=(g.all_items||[]).filter(x=>!x.translation && !x.tbd);
  let h='<div class="sect"><h2>현황</h2><div class="cards">'
    +card("전체 항목",g.total)+card("확정",g.decided)
    +card("결정 대기",g.pending)+card("미검토",g.untouched)+"</div></div>";

  const ed=(g.all_items||[]).find(d=>d.term===editing);
  if(ed) h+='<div class="sect"><h2>수정 중</h2>'+termCard(ed,true)+"</div>";

  h+='<div class="sect"><h2>결정이 필요한 용어 <span class="n">('+g.pending+')</span></h2>';
  h+= g.pending ? g.pending_items.map(t=>termCard(t,false)).join("") : '<p class="sub">모두 확정</p>';
  h+="</div>";

  h+=listSection("decided","확정된 용어",g.decided_items);
  h+=listSection("untouched","미검토 용어",untouched);

  h+='<div class="sect"><h2>용어 추가</h2><div class="row">'
    +'<input id="newTerm" placeholder="원어 (예: Work print)">'
    +'<input id="newTr" placeholder="번역어">'
    +'<input id="newNote" placeholder="메모 (선택)">'
    +'<button class="save" id="addBtn">추가</button></div></div>';

  const q=query.trim().toLowerCase();
  const hits=q?(g.all_items||[]).filter(x=>x.term.toLowerCase().includes(q)||(x.translation||"").toLowerCase().includes(q)):[];
  h+='<div class="sect"><h2>용어 검색</h2><div class="row">'
    +'<input id="q" placeholder="원어 또는 번역어로 검색" value="'+esc(query)+'"></div>';
  if(q){
    h+='<p class="sub" style="margin:12px 0 6px">'+hits.length+'건</p><div class="two">';
    for(const x of hits.slice(0,120))
      h+='<div class="pair" data-term="'+esc(x.term)+'"><span class="en">'+esc(dispTerm(x))+"</span><span>"
        +esc(x.translation||(x.tbd?"미정":"—"))+"</span></div>";
    h+="</div>";
    if(hits.length>120) h+='<p class="sub">앞 120건만 표시</p>';
  }
  h+="</div>";

  el("glossary").innerHTML=h;
  bindGlossary();
  if(flashPending && editing){
    flashPending=false;
    const c=el("glossary").querySelector(".term.edit");
    if(c){
      c.scrollIntoView({behavior:"smooth",block:"center"});
      c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
      const inp=c.querySelector('input[data-k="choice"]');
      if(inp) setTimeout(()=>inp.focus(),450);
    }
  }
}

function termCard(t,isEdit){
  const key=esc(t.term), cur=t.current||t.translation||"";
  let h='<div class="term'+(isEdit?" edit":"")+'"><h3>'+esc(dispTerm(t))
    +(t.full?' <span class="tip" style="font-size:14px;font-weight:400">— '+esc(t.full)+"</span>":"")+"</h3>";
  // 맥락에 따라 갈리는 번역어. 자유 서술(표기 메모)에 묻어 두면 번역본에서 짚히지 않는다.
  for(const a of (t.alternates||[]))
    h+='<p class="why alt">또는 <b>'+esc(a.value)+"</b>"
      +(a.when?' <span class="tip">— '+esc(a.when)+"</span>":"")+"</p>";
  for(const x of (t.senses||[]))
    h+='<p class="why sense"><b>'+esc(x.case)+"</b> "+esc(x.means)+"</p>";
  if(t.same_as) h+='<p class="why">같은 뜻: <b>'+esc(t.same_as)+"</b></p>";
  if(t.context) h+='<p class="why">'+esc(t.context)+"</p>";
  else if(t.definition_en) h+='<p class="why">'+esc(t.definition_en)+"</p>";
  if(t.hits)
    h+='<p class="why hits">본문 등장 '+t.hits+'회 · '+esc((t.in_chunks||[]).join(", "))+"</p>";
  const qs=t.quotes||[], SHOW=2, more=qs.length>SHOW, open=quotesOpen[t.term];
  if(qs.length){
    h+='<div class="quotes'+(open?" open":"")+'">';
    qs.forEach((q,i)=>{
      // 원문 보기로 건너뛸 수 있게 쪽번호를 링크로. 용어집에서 문맥을 더 볼 때 왕복이 닫힌다.
      const loc='원서 p.'+esc(q.page)+(q.chunk?' <em>'+esc(q.chunk)+"</em>":"");
      h+='<div class="q'+(i>=SHOW&&!open?" hid":"")+'">'
        +(q.chunk?'<a class="p" target="_blank" href="/view?kind=source&id='+esc(q.chunk)+'">'+loc+"</a>"
                 :'<span class="p">'+loc+"</span>")
        +'<span class="t">'+mark(q.text,t.term)+"</span></div>";
    });
    h+="</div>";
    if(more)
      h+='<button class="qmore" data-quotes="'+key+'">'
        +(open?"접기":"용례 "+qs.length+"개 모두 보기")+"</button>";
  }
  if((t.options||[]).length){
    h+='<div class="opts">';
    for(const o of t.options)
      h+='<button data-term="'+key+'" data-val="'+esc(o)+'"'+(cur===o?' class="sel"':"")+">"+esc(o)+"</button>";
    h+="</div>";
  }
  h+='<div class="row">'
    +'<input placeholder="번역어 직접 입력" value="'+(isEdit?esc(cur):"")+'" data-term="'+key+'" data-k="choice">'
    +'<input placeholder="풀어쓴 이름 (선택) — 예: Association of Moving Image Archivists" value="'+esc(t.full||"")+'" data-term="'+key+'" data-k="full">'
    +"</div><div class=\"row\">"
    +'<input placeholder="표기 규칙 메모 (선택) — 예: 첫 등장 시 원문 병기" value="'+esc(t.notation||"")+'" data-term="'+key+'" data-k="note">'
    +'<button class="save" data-term="'+key+'">저장</button>'
    +(isEdit?'<button class="save" data-cancel="1">닫기</button>':"")+"</div>";
  if(isEdit)
    h+='<div class="row">'
      +'<input placeholder="새 원어를 입력 (현재: '+key+')" value="" data-term="'+key+'" data-k="rename">'
      +'<button class="save" data-rename="'+key+'">원어 수정</button>'
      +'<button class="save danger" data-del="'+key+'">삭제</button></div>';
  return h+"</div>";
}

function bindGlossary(){
  document.querySelectorAll("[data-quotes]").forEach(b=>{
    b.onclick=()=>{ const t=b.dataset.quotes;
      quotesOpen[t]=!quotesOpen[t]; renderGlossary(); };
  });
  const root=el("glossary");
  root.querySelectorAll(".acc[data-acc]").forEach(a=>{
    a.onclick=()=>{ acc[a.dataset.acc]=!acc[a.dataset.acc]; renderGlossary(); };
  });
  root.querySelectorAll(".filters button").forEach(b=>{
    b.onclick=()=>{ filter[b.dataset.f]=b.dataset.v; renderGlossary(); };
  });
  root.querySelectorAll(".opts button").forEach(b=>{
    b.onclick=()=>decide(b.dataset.term,b.dataset.val,noteOf(b.dataset.term));
  });
  root.querySelectorAll(".save[data-term]").forEach(b=>{ b.onclick=()=>saveRow(b.dataset.term); });
  root.querySelectorAll(".save[data-cancel]").forEach(b=>{
    b.onclick=()=>{ editing=null; lastJSON=""; tick(); };
  });
  root.querySelectorAll(".save[data-rename]").forEach(b=>{
    b.onclick=async()=>{
      const t=b.dataset.rename, inp=inputOf(t,"rename"), v=inp?inp.value.trim():"";
      if(!v){ alert("바꿀 새 원어를 입력해 주세요."); return; }
      if(v===t){ alert("현재 원어와 같습니다."); return; }
      const ok=await post("/api/rename",{term:t,choice:v});
      if(ok){ editing=v; flashPending=true; lastJSON=""; await tick(); }
    };
  });
  root.querySelectorAll(".save[data-del]").forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.del;
      if(confirm("'"+t+"' 항목을 삭제할까요?\n삭제 기록은 결정 로그에 남습니다.")) post("/api/delete",{term:t});
    };
  });
  root.querySelectorAll(".pair[data-term]").forEach(p=>{
    p.onclick=()=>{ editing=p.dataset.term; flashPending=true; lastJSON=""; tick(); };
  });
  root.querySelectorAll("input[data-term]").forEach(inp=>{
    inp.onkeydown=e=>{ if(e.key==="Enter"&&inp.dataset.k!=="rename"){ e.preventDefault(); saveRow(inp.dataset.term); } };
  });
  const add=el("addBtn"); if(add) add.onclick=addTerm;
  const q=el("q");
  if(q) q.oninput=()=>{ query=q.value; const pos=q.selectionStart;
    renderGlossary(); const n=el("q"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
}

function inputOf(term,k){
  return el("glossary").querySelector('input[data-term="'+CSS.escape(term)+'"][data-k="'+k+'"]');
}
function noteOf(term){ const i=inputOf(term,"note"); return i? i.value.trim() : ""; }
function currentOf(term){
  const x=(S.glossary.all_items||[]).find(y=>y.term===term);
  return x ? (x.translation||"") : "";
}
function fullOf(term){ const i=inputOf(term,"full"); return i? i.value.trim() : ""; }
function saveRow(term){
  const ci=inputOf(term,"choice");
  const val=(ci && ci.value.trim()) || currentOf(term);
  if(!val){ alert("번역어를 고르거나 직접 입력한 뒤 저장해 주세요."); return; }
  decide(term,val,noteOf(term),fullOf(term));
}
async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  const j=await r.json();
  if(!j.ok){ alert(j.message||"처리하지 못했습니다."); return false; }  // 입력 내용 보존
  editing=null; lastJSON=""; await tick(); return true;
}
async function addTerm(){
  const t=el("newTerm").value.trim(), v=el("newTr").value.trim(), n=el("newNote").value.trim();
  if(!t||!v){ alert("원어와 번역어를 모두 입력해 주세요."); return; }
  await post("/api/add",{term:t,choice:v,note:n});
}
async function decide(term,choice,note,full){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  await post("/api/decide",{term:term,choice:choice,note:note||"",full:full||fullOf(term)});
}

let glossaryStale=false, lastPercent=null, pressing=false;

async function tick(){
  try{
    const r=await fetch("/api/state",{cache:"no-store"});
    const txt=await r.text();
    const ae=document.activeElement;
    const typing=(pressing) ||
                 (ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")
                  && el("glossary").contains(ae));
    const now=new Date();
    const stamp=now.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})
               +" "+now.toLocaleTimeString("ko-KR");
    el("live").textContent=(typing?"입력 중 · ":"")+stamp+" 최종업데이트";
    if(txt===lastJSON) return;
    lastJSON=txt; S=JSON.parse(txt);
    el("book").textContent=(S.info.title||"")+" · "+(S.info.publisher||"")+" · "+(S.info.direction||"");

    // 개요·청크는 항상 갱신한다 (진행율이 실시간으로 올라가야 하므로)
    const changed = lastPercent!==null && S.progress.percent!==lastPercent;
    renderOverview(); renderChunks();
    if(changed){
      const v=el("overview").querySelectorAll(".stat .v")[2];
      if(v){ v.classList.remove("bump"); void v.offsetWidth; v.classList.add("bump"); }
    }
    lastPercent=S.progress.percent;

    // 용어집은 입력 중일 때만 보류했다가, 입력이 끝나면 따라잡는다
    if(typing) glossaryStale=true; else { glossaryStale=false; renderGlossary(); }
  }catch(e){ el("live").textContent="서버 연결 끊김"; }
}

// 입력칸에 커서가 있을 때 버튼을 누르면 focusout이 먼저 일어난다.
// 그 자리에서 다시 그리면 누르던 버튼이 사라져 클릭이 삼켜지므로,
// 마우스를 누르고 있는 동안에는 다시 그리기를 미룬다.
document.addEventListener("pointerdown", e=>{
  const g=el("glossary");
  if(g && g.contains(e.target)) pressing=true;
}, true);
document.addEventListener("pointerup", ()=>{ setTimeout(()=>{ pressing=false; }, 0); }, true);
document.addEventListener("pointercancel", ()=>{ pressing=false; }, true);

function flushGlossary(){
  if(pressing){ setTimeout(flushGlossary,120); return; }   // 클릭이 끝날 때까지 대기
  const a=document.activeElement;
  const still=a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA") && el("glossary").contains(a);
  if(glossaryStale && !still){ glossaryStale=false; renderGlossary(); }
}
document.addEventListener("focusout", ()=>setTimeout(flushGlossary,60));

// 서버 코드는 프로세스가 뜰 때 한 번 읽혀 메모리에 올라간다. 그래서 코드를 고치면
// 새로고침이 아니라 프로세스를 다시 띄워야 반영된다. 창을 새로 열지 않고 여기서 한다.
el("restart").onclick=async()=>{
  const b=el("restart"); b.disabled=true; b.textContent="다시 띄우는 중…";
  try{ await fetch("/api/restart",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}); }
  catch(e){}
  for(let i=0;i<40;i++){                       // 최대 20초 기다렸다가 새로고침
    await new Promise(r=>setTimeout(r,500));
    try{ const r=await fetch("/api/state",{cache:"no-store"}); if(r.ok){ location.reload(); return; } }
    catch(e){}
  }
  b.disabled=false; b.textContent="서버 재실행";
  alert("서버가 다시 뜨지 않았습니다. 실행 창을 확인해 주세요.");
};

tick(); setInterval(tick,2000);
</script></body></html>
